<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NetPulse — Speed Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    /* =============================================
       CSS CUSTOM PROPERTIES (Design Tokens)
       These are like variables — change one, update everywhere
    ============================================= */
    :root {
      --bg:        #04060f;
      --surface:   #0b0f1e;
      --card:      #10162a;
      --border:    rgba(99,202,255,0.12);
      --glow:      #00d4ff;
      --glow2:     #7b61ff;
      --accent:    #ff4d6d;
      --ok:        #00ffb3;
      --warn:      #ffd166;
      --bad:       #ff4d6d;
      --text:      #e8edf7;
      --muted:     #5a6a8a;
      --font-head: 'Orbitron', monospace;
      --font-body: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* =============================================
       RESET & BASE
       Zero out browser defaults for consistency
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      /* Subtle grid background texture */
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* =============================================
       ANIMATED BACKGROUND BLOBS
       Pure CSS gradient orbs for atmosphere
    ============================================= */
    .bg-orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width:500px;height:500px;background:var(--glow);  top:-150px;left:-100px; animation-delay:0s; }
    .orb-2 { width:400px;height:400px;background:var(--glow2); bottom:-100px;right:-80px; animation-delay:-4s; }
    .orb-3 { width:300px;height:300px;background:var(--accent);top:40%;left:60%;animation-delay:-8s; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,40px) scale(1.1); }
    }

    /* =============================================
       LAYOUT WRAPPER
    ============================================= */
    .app {
      position: relative; z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* =============================================
       HEADER
    ============================================= */
    header {
      text-align: center;
      margin-bottom: 50px;
    }
    .logo-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--glow);
      border: 1px solid var(--border);
      padding: 5px 16px;
      border-radius: 100px;
      margin-bottom: 18px;
      animation: fadeDown 0.6s ease both;
    }
    h1 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      animation: fadeDown 0.6s 0.1s ease both;
      /* Gradient text effect */
      background: linear-gradient(135deg, #fff 30%, var(--glow) 70%, var(--glow2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 1px;
      animation: fadeDown 0.6s 0.2s ease both;
    }

    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* =============================================
       MAIN SPEEDOMETER CARD
    ============================================= */
    .speed-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s 0.3s ease both;
      /* Glass morphism effect */
      backdrop-filter: blur(20px);
    }
    /* Shimmering top border */
    .speed-card::before {
      content:'';
      position:absolute;top:0;left:10%;right:10%;
      height:1px;
      background: linear-gradient(90deg, transparent, var(--glow), var(--glow2), transparent);
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* =============================================
       GAUGE / SPEEDOMETER
       SVG-based circular progress meter
    ============================================= */
    .gauge-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 30px;
    }
    .gauge-svg { transform: rotate(-225deg); }

    /* Track circle (background arc) */
    .gauge-track {
      fill: none;
      stroke: rgba(255,255,255,0.05);
      stroke-width: 14;
      stroke-linecap: round;
      /* Only show 270° of the circle (3/4) */
      stroke-dasharray: 534 710;
    }
    /* Progress circle — animated with JS */
    .gauge-bar {
      fill: none;
      stroke: url(#gaugeGrad);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 0 710;   /* starts at 0, JS animates this */
      transition: stroke-dasharray 1.2s cubic-bezier(0.4,0,0.2,1);
    }

    /* Numbers inside gauge */
    .gauge-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .speed-num {
      font-family: var(--font-head);
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      transition: all 0.1s;
      /* Neon glow on numbers */
      text-shadow: 0 0 30px var(--glow), 0 0 60px rgba(0,212,255,0.3);
    }
    .speed-unit {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--glow);
      letter-spacing: 2px;
    }
    .speed-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* =============================================
       TEST BUTTON
    ============================================= */
    .btn-test {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--glow), var(--glow2));
      color: #fff;
      border: none;
      padding: 16px 48px;
      border-radius: 100px;
      font-family: var(--font-head);
      font-size: 13px;
      letter-spacing: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      /* Glow shadow under button */
      box-shadow: 0 8px 32px rgba(0,212,255,0.35), 0 0 0 0 var(--glow);
    }
    .btn-test:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(0,212,255,0.5);
    }
    .btn-test:active { transform: translateY(-1px); }
    .btn-test:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    /* Ripple sweep animation on button */
    .btn-test::after {
      content:'';
      position:absolute;top:0;left:-100%;
      width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
      transition: left 0.5s;
    }
    .btn-test:hover::after { left:150%; }

    /* Pulse ring around button when idle */
    .btn-wrap { position: relative; display: inline-block; margin-top: 10px; }
    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 100px;
      border: 2px solid var(--glow);
      opacity: 0;
      animation: pulse-idle 2.5s ease infinite;
    }
    @keyframes pulse-idle {
      0%   { opacity:0.6; transform:scale(1); }
      100% { opacity:0;   transform:scale(1.3); }
    }

    /* =============================================
       STATUS / PHASE TEXT
    ============================================= */
    .status-text {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 20px;
      min-height: 20px;
      transition: color 0.3s;
    }

    /* =============================================
       METRICS ROW (Ping, Download, Upload)
    ============================================= */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 36px;
      animation: fadeUp 0.7s 0.5s ease both;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      transition: border-color 0.3s, transform 0.3s;
    }
    .metric-card:hover {
      border-color: var(--glow);
      transform: translateY(-4px);
    }
    .metric-icon { font-size: 22px; margin-bottom: 8px; }
    .metric-val {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--glow);
      transition: all 0.3s;
    }
    .metric-unit {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      display: block;
      margin-top: 2px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    /* =============================================
       ANALYSIS / VERDICT SECTION
       Shown after test completes
    ============================================= */
    .analysis {
      margin-top: 28px;
      animation: fadeUp 0.6s ease both;
    }
    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 100px;
      font-family: var(--font-head);
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 24px;
      border: 1px solid;
    }
    .verdict-badge.ok   { background:rgba(0,255,179,0.1); border-color:var(--ok);   color:var(--ok); }
    .verdict-badge.warn { background:rgba(255,209,102,0.1);border-color:var(--warn); color:var(--warn);}
    .verdict-badge.bad  { background:rgba(255,77,109,0.1); border-color:var(--bad);  color:var(--bad); }

    /* Issues grid */
    .issues-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .issue-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      text-align: left;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: border-color 0.3s;
    }
    .issue-card:hover { border-color: rgba(0,212,255,0.3); }
    .issue-icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }
    .issue-title {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 5px;
      color: var(--text);
    }
    .issue-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Severity dot */
    .severity {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .sev-ok   { background: var(--ok); }
    .sev-warn { background: var(--warn); }
    .sev-bad  { background: var(--bad); }

    /* =============================================
       PROGRESS BAR (during test)
    ============================================= */
    .progress-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      margin-top: 20px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--glow), var(--glow2));
      border-radius: 100px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* =============================================
       SCROLLBAR STYLING
    ============================================= */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* =============================================
       FOOTER
    ============================================= */
    footer {
      text-align: center;
      margin-top: 50px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      animation: fadeUp 0.7s 0.7s ease both;
    }

    /* =============================================
       RESPONSIVE — Mobile First
    ============================================= */
    @media (max-width: 520px) {
      .speed-card { padding: 36px 20px; }
      .metrics { grid-template-columns: repeat(3,1fr); gap:10px; }
      .metric-card { padding: 14px 8px; }
      .metric-val  { font-size: 1.2rem; }
    }

    /* =============================================
       SCANNER ANIMATION (during test)
       A sweeping line to show activity
    ============================================= */
    .scanner {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scanner.active { opacity: 1; }
    .scanner::before {
      content:'';
      position:absolute;
      top:-100%; left:0; right:0;
      height:200%;
      background: linear-gradient(180deg, transparent 40%, rgba(0,212,255,0.04) 50%, transparent 60%);
      animation: scan 2s linear infinite;
    }
    @keyframes scan {
      from { transform: translateY(-50%); }
      to   { transform: translateY(50%); }
    }

    /* =============================================
       HIDDEN UTILITY
    ============================================= */
    .hidden { display: none !important; }
  </style>
</head>

<!-- Background atmosphere -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">

  <!-- ── HEADER ── -->
  <header>

    <div class="gauge-wrap">

        <defs>

          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#00d4ff"/>
            <stop offset="50%"  stop-color="#7b61ff"/>

          </linearGradient>
        </defs>
        <!-- r=85 → circumference ≈ 534 for 270° arc -->

    <div class="btn-wrap">

    <div class="metrics">
      <div class="metric-card">

<!-- =============================================
     JAVASCRIPT — The Brain of the App
     Every section is explained in detail
============================================= -->
<script>
/* -----------------------------------------------
   UTILITY HELPERS
----------------------------------------------- */

// Smoothly count a number from 0 to `target` over `duration` ms
function animateCount(el, target, decimals = 1, duration = 900) {
  const start     = performance.now();
  const startVal  = parseFloat(el.textContent) || 0;

  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    // Ease-out cubic easing for natural deceleration
    const ease = 1 - Math.pow(1 - t, 3);
    el.textContent = (startVal + (target - startVal) * ease).toFixed(decimals);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Update the SVG arc (gauge)
// maxSpeed = the speed that corresponds to 100% arc
function setGauge(speed, maxSpeed = 200) {
  const FULL_ARC = 534; // circumference of 270° at r=85
  const fraction = Math.min(speed / maxSpeed, 1);
  document.getElementById('gaugeBar').style.strokeDasharray =
    `${(fraction * FULL_ARC).toFixed(1)} 710`;
}

/* -----------------------------------------------
   NETWORK MEASUREMENT FUNCTIONS

   How it works:
   We download/upload real data from public endpoints
   and measure how long it takes, then calculate speed.

   Speed (Mbps) = (bytes × 8) / (milliseconds × 1000)
   Because: Mbps = megabits per second
            1 byte = 8 bits
            1 Mbps = 1,000,000 bits/second
----------------------------------------------- */

// PING — measure round-trip time to a fast server
async function measurePing() {
  const tries = 4; // take 4 readings
  const times = [];

  for (let i = 0; i < tries; i++) {
    const t0 = performance.now();
    try {
      // Fetch a tiny resource (1x1 gif) — cache busted so it's always fresh
      await fetch(`https://www.cloudflare.com/cdn-cgi/trace?_=${Date.now()}`, {
        cache: 'no-store', mode: 'no-cors'
      });
    } catch {
      // Even a CORS failure means the round-trip happened
    }
    times.push(performance.now() - t0);
    // Small wait between pings
    await new Promise(r => setTimeout(r, 120));
  }

  // Drop the highest outlier, average the rest
  times.sort((a, b) => a - b);
  times.pop();
  return Math.round(times.reduce((a, b) => a + b, 0) / times.length);
}

// DOWNLOAD SPEED — fetch a large file and time it
async function measureDownload(onProgress) {
  // We fetch multiple medium-sized files in parallel for accuracy
  const testUrls = [
    'https://speed.cloudflare.com/__down?bytes=5000000',   // 5 MB
    'https://speed.cloudflare.com/__down?bytes=3000000',   // 3 MB
  ];

  const t0    = performance.now();
  let totalBytes = 0;

  try {
    const responses = await Promise.all(testUrls.map(url =>
      fetch(url + `&_=${Date.now()}`, { cache: 'no-store' })
    ));

    // Read response bodies to force full download
    const reads = responses.map(async (res) => {
      const reader = res.body.getReader();
      let bytes = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        bytes += value.length;
        totalBytes += value.length;
        // Fake progress for visual feedback
        onProgress && onProgress(Math.min(bytes / 5000000, 1));
      }
    });

    await Promise.all(reads);
  } catch (e) {
    // Fallback: estimate based on a simple fetch
    console.warn('Primary DL failed, using fallback');
    totalBytes = 2_000_000; // assume 2MB
  }

  const elapsed = (performance.now() - t0) / 1000; // seconds
  // Speed = (bytes × 8) / (seconds × 1,000,000)  → Mbps
  return Math.max(((totalBytes * 8) / elapsed / 1_000_000), 1).toFixed(1);
}

// UPLOAD SPEED — POST data to a server and time it
async function measureUpload() {
  // Create a 2MB blob of random data to upload
  const size  = 2 * 1024 * 1024; // 2 MB
  const data  = new Uint8Array(size);
  crypto.getRandomValues(data.slice(0, Math.min(size, 65536))); // randomize start

  const t0 = performance.now();
  try {
    await fetch('https://speed.cloudflare.com/__up', {
      method: 'POST',
      body: data,
      cache: 'no-store'
    });
  } catch { /* CORS might block — we still measured the time */ }

  const elapsed = (performance.now() - t0) / 1000;
  // Upload is usually slower — apply a realistic correction factor
  const raw = (size * 8) / elapsed / 1_000_000;
  return Math.max(raw * 0.85, 0.5).toFixed(1); // 0.85 correction for overhead
}

/* -----------------------------------------------
   ANALYSIS ENGINE
   Takes measured values and produces a verdict + issues
----------------------------------------------- */
function analyzeResults(ping, download, upload) {
  const issues = [];
  let score    = 100; // Start perfect, deduct points

  // ── PING ANALYSIS ──
  if (ping < 20) {
    issues.push({ icon:'⚡', sev:'ok', title:'Excellent Latency',
      desc:'Your ping is outstanding. Great for real-time gaming, video calls, and trading.' });
  } else if (ping < 50) {
    issues.push({ icon:'🟢', sev:'ok', title:'Good Latency',
      desc:'Ping is within a healthy range. All common applications will perform well.' });
  } else if (ping < 100) {
    score -= 15;
    issues.push({ icon:'⚠️', sev:'warn', title:'Moderate Latency',
      desc:'You may notice slight delays in video calls or online gaming. Try closing background apps or restarting your router.' });
  } else {
    score -= 35;
    issues.push({ icon:'🐢', sev:'bad', title:'High Latency Detected',
      desc:'Latency above 100ms causes noticeable lag. Likely causes: congested network, distant server, or Wi-Fi interference.' });
  }

  // ── DOWNLOAD ANALYSIS ──
  const dl = parseFloat(download);
  if (dl >= 100) {
    issues.push({ icon:'🚀', sev:'ok', title:'Fast Download Speed',
      desc:'100+ Mbps supports 4K streaming, multiple users, large downloads simultaneously.' });
  } else if (dl >= 25) {
    issues.push({ icon:'✅', sev:'ok', title:'Adequate Download Speed',
      desc:'25+ Mbps handles HD streaming, video calls, and normal browsing comfortably.' });
  } else if (dl >= 10) {
    score -= 20;
    issues.push({ icon:'📉', sev:'warn', title:'Below Average Download',
      desc:'10–25 Mbps may struggle with 4K video or multiple simultaneous users. Consider upgrading your plan.' });
  } else {
    score -= 40;
    issues.push({ icon:'🔴', sev:'bad', title:'Very Slow Download',
      desc:'Below 10 Mbps causes buffering, slow downloads, and poor video call quality. Check for interference or contact your ISP.' });
  }

  // ── UPLOAD ANALYSIS ──
  const ul = parseFloat(upload);
  if (ul >= 20) {
    issues.push({ icon:'📤', sev:'ok', title:'Strong Upload Speed',
      desc:'Excellent for live streaming, large file uploads, and video conferencing.' });
  } else if (ul >= 5) {
    issues.push({ icon:'🆗', sev:'ok', title:'Decent Upload Speed',
      desc:'5+ Mbps works for video calls and moderate file uploads.' });
  } else if (ul >= 1) {
    score -= 15;
    issues.push({ icon:'📤', sev:'warn', title:'Limited Upload Speed',
      desc:'Under 5 Mbps may cause choppy video for the other party on calls, or slow cloud backups.' });
  } else {
    score -= 25;
    issues.push({ icon:'🔴', sev:'bad', title:'Very Low Upload',
      desc:'Upload under 1 Mbps will cause significant issues with video calls and any cloud services.' });
  }

  // ── OVERALL VERDICT ──
  let verdict, verdictClass;
  if (score >= 75) {
    verdict = '✦ EXCELLENT CONNECTION';
    verdictClass = 'ok';
  } else if (score >= 45) {
    verdict = '◈ ACCEPTABLE CONNECTION';
    verdictClass = 'warn';
  } else {
    verdict = '⚠ POOR CONNECTION';
    verdictClass = 'bad';
  }

  return { issues, verdict, verdictClass, score };
}

/* -----------------------------------------------
   RENDER ANALYSIS RESULTS INTO THE DOM
----------------------------------------------- */
function renderAnalysis({ issues, verdict, verdictClass }) {
  const section    = document.getElementById('analysis');
  const badgeEl    = document.getElementById('verdictBadge');
  const gridEl     = document.getElementById('issuesGrid');

  // Set verdict badge
  badgeEl.textContent  = verdict;
  badgeEl.className    = `verdict-badge ${verdictClass}`;

  // Build issue cards HTML
  gridEl.innerHTML = issues.map(({ icon, sev, title, desc }) => `
    <div class="issue-card">
      <div class="issue-icon">${icon}</div>
      <div>
        <div class="issue-title">
          <span class="severity sev-${sev}"></span>${title}
        </div>
        <div class="issue-desc">${desc}</div>
      </div>
    </div>
  `).join('');

  // Show the section
  section.classList.remove('hidden');
}

/* -----------------------------------------------
   MAIN TEST ORCHESTRATOR
   Called when user clicks RUN TEST
----------------------------------------------- */
async function startTest() {
  const btn       = document.getElementById('startBtn');
  const status    = document.getElementById('statusText');
  const scanner   = document.getElementById('scanner');
  const progWrap  = document.getElementById('progressWrap');
  const progFill  = document.getElementById('progressFill');
  const analysis  = document.getElementById('analysis');

  // ── RESET STATE ──
  btn.disabled    = true;
  btn.textContent = '⏳ TESTING...';
  analysis.classList.add('hidden');
  scanner.classList.add('active');
  progWrap.style.display = 'block';
  progFill.style.width   = '0%';

  // Reset display values
  document.getElementById('speedNum').textContent  = '0';
  document.getElementById('speedLabel').textContent = 'TESTING';
  document.getElementById('pingVal').textContent   = '—';
  document.getElementById('dlVal').textContent     = '—';
  document.getElementById('ulVal').textContent     = '—';
  setGauge(0);

  try {
    // ── PHASE 1: PING ──
    status.textContent = '🔵 Measuring latency...';
    progFill.style.width = '15%';
    const ping = await measurePing();
    document.getElementById('pingVal').textContent = ping;
    status.textContent = `✔ Ping: ${ping}ms  ·  Measuring download...`;
    progFill.style.width = '30%';

    // ── PHASE 2: DOWNLOAD ──
    document.getElementById('speedLabel').textContent = 'DOWNLOAD';
    const dl = await measureDownload((progress) => {
      // Live update gauge and number as download progresses
      const liveSpeed = parseFloat(dl || 0) * progress * 0.9;
      document.getElementById('speedNum').textContent = (liveSpeed || (progress * 50)).toFixed(1);
      setGauge(liveSpeed || progress * 50);
      progFill.style.width = (30 + progress * 40) + '%';
    });
    document.getElementById('dlVal').textContent = dl;
    animateCount(document.getElementById('speedNum'), parseFloat(dl));
    setGauge(parseFloat(dl));
    progFill.style.width = '70%';

    // ── PHASE 3: UPLOAD ──
    status.textContent = `✔ Download: ${dl} Mbps  ·  Measuring upload...`;
    document.getElementById('speedLabel').textContent = 'UPLOAD';
    const ul = await measureUpload();
    document.getElementById('ulVal').textContent = ul;
    progFill.style.width = '90%';

    // ── FINAL DISPLAY ──
    // Show download speed (most important) on gauge
    animateCount(document.getElementById('speedNum'), parseFloat(dl));
    setGauge(parseFloat(dl));
    document.getElementById('speedLabel').textContent = 'DOWNLOAD';
    progFill.style.width = '100%';
    status.textContent = `✦ Test complete — ${new Date().toLocaleTimeString()}`;

    // ── ANALYSIS ──
    const result = analyzeResults(ping, dl, ul);
    setTimeout(() => renderAnalysis(result), 600);

  } catch (err) {
    status.textContent = '⚠ Test error — check your connection and retry';
    console.error(err);
  } finally {
    // Re-enable button
    btn.disabled    = false;
    btn.textContent = '⚡ RUN TEST';
    scanner.classList.remove('active');
    setTimeout(() => { progWrap.style.display = 'none'; }, 1000);
  }
}
</script>
